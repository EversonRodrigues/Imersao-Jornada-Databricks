# Imersão Jornada de Dados no Databricks
# Declarative Automation Bundle (antigo Databricks Asset Bundle) que implanta
# o projeto inteiro: pipeline diário, testes de qualidade, dashboards e Genie.
#
#   databricks bundle validate --strict
#   databricks bundle deploy -t prod
#   databricks bundle run pipeline_ecommerce -t prod
#
# Guia completo: aula-03-claude-code/README.md

bundle:
  name: imersao-jornada-databricks

include:
  - resources/*.yml

# Os slides da imersão ficam no repositório, mas não vão para o workspace.
sync:
  exclude:
    - "*.pptx"

variables:
  catalogo:
    description: Catálogo do Unity Catalog com os schemas raw, bronze, silver e gold.
    default: ecommerce
  url_base:
    description: Endereço de onde o pipeline baixa os arquivos Parquet (o "data lake").
    default: https://raw.githubusercontent.com/lvgalvao/Imersao-Jornada-Databricks/main/dados
  warehouse_id:
    description: SQL warehouse usado pelos dashboards e pelo Genie.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  # Para experimentar: recursos ganham o prefixo "[dev seu_usuario]" e o
  # agendamento do Job fica pausado.
  dev:
    mode: development
    default: true

  # A versão "oficial": nomes limpos e Job agendado todo dia às 6h.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
