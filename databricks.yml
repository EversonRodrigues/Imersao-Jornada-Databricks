# Imersão Jornada de Dados no Databricks
# Declarative Automation Bundle (antigo Databricks Asset Bundle) que implanta
# o projeto inteiro: pipeline diário, testes de qualidade, dashboards e Genie.
#
#   databricks bundle validate --strict
#   databricks bundle deploy -t prod
#   databricks bundle run pipeline_ecommerce -t prod
#
# Guia completo: aula-03-claude-code/README.md

bundle:
  name: imersao-jornada-databricks

include:
  - resources/*.yml

# Os slides da imersão ficam no repositório, mas não vão para o workspace.
sync:
  exclude:
    - "*.pptx"

variables:
  catalogo:
    description: Catálogo do Unity Catalog com os schemas bronze, silver e gold.
    default: ecommerce
  origem:
    description: >-
      De onde o pipeline lê os dados: "supabase" (data lake no Storage do Supabase, o normal na
      aula) ou "arquivos" (plano B, lê os Parquet do GitHub). Troque para "supabase" depois de
      guardar as chaves: databricks secrets put-secret imersao s3_key (e s3_secret). O endpoint, o
      bucket e a região ficam nas constantes do notebook 01_ingestao_bronze.
    default: arquivos
  url_base:
    description: Endereço dos arquivos Parquet usados quando origem = "arquivos".
    default: https://raw.githubusercontent.com/lvgalvao/Imersao-Jornada-Databricks/main/dados
  warehouse_id:
    description: SQL warehouse usado pelos dashboards e pelo Genie.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  # Para experimentar: recursos ganham o prefixo "[dev seu_usuario]" e o
  # agendamento do Job fica pausado.
  dev:
    mode: development
    default: true

  # A versão "oficial": nomes limpos e Job agendado todo dia às 6h.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
